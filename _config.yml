# Clash Note - Hexo 站点配置（本地构建，未部署）
title: Clash Note
subtitle: Clash 教程、Mihomo 配置与机场选择指南
description: Clash Note 提供 Clash Verge Rev 教程、Mihomo 配置、订阅导入与故障排查，并整理 17 家机场的公开资料、套餐与 Clash 兼容状态。
keywords: Clash Verge Rev, Mihomo, Clash 教程, 机场推荐, 订阅导入
author: Clash Note 编辑部
language: zh-CN
timezone: Asia/Shanghai

url: https://clashnote.blog
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - robots.txt
  - "**/*.json"

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: true

marked:
  gfm: true
  breaks: false
  smartypants: false
  headerIds: true
  mangle: false

index_generator:
  path: ''
  per_page: 0
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: empty

per_page: 12
pagination_dir: page

theme: clashnote

ignore:
  - "**/.DS_Store"

